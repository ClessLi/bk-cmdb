apiVersion: v2
appVersion: 3.14.5
description: BlueKing Configuration Management DataBase (bk-cmdb) is an enterprise level configuration management serivce database.
name: bk-cmdb-web
type: application
version: 3.15.5
dependencies:
  - name: common
    repository: file://../dependencies/common
    version: 2.2.2
  - condition: redis.enabled
    name: redis
    repository: file://../dependencies/redis
    version: 17.3.17
  - condition: mongodb.enabled
    name: mongodb
    repository: file://../dependencies/mongodb
    version: 13.6.1
